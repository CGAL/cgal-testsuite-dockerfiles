name: Dockerfile testsuite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # On Sundays at 01:00
    - cron: '0 1 * * SUN'

jobs:
  compile-and-push-docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test_platform: ['ArchLinux','Debian-stable','Debian-testing','Fedora','Fedora-32','Fedora-rawhide','Ubuntu']
        include:
          # Variants whose Toolbx image is built and checked on each platform
          - test_platform: ArchLinux
            toolbox_variants: ArchLinux ArchLinux-clang
          - test_platform: Debian-stable
            toolbox_variants: Debian-stable Debian-stable-cross-compilation-for-arm
          - test_platform: Debian-testing
            toolbox_variants: Debian-testing Debian-testing-clang-main
          - test_platform: Fedora
            toolbox_variants: Fedora Fedora-Release
          - test_platform: Fedora-32
            toolbox_variants: Fedora-32
          - test_platform: Fedora-rawhide
            toolbox_variants: Fedora-rawhide
          - test_platform: Ubuntu
            toolbox_variants: Ubuntu Ubuntu-GCC6 Ubuntu-NO_DEPRECATED_CODE
      fail-fast: false

    steps:
    - name: Git checkout
      uses: actions/checkout@v6

    - name: Compile images
      run: bash -$- ./test.sh ${{ matrix.test_platform }}

    - name: Summary
      run: |
        set -e
        [ -n "$ACTIONS_RUNNER_DEBUG" ] && set -x
        function quote() {
          printf '`%s`' "$1"
        }
        exec >> "$GITHUB_STEP_SUMMARY"
        prefix=$(echo "${{ matrix.test_platform }}" | tr 'A-Z' 'a-z')
        images=$(docker images --format '{{.Repository}}:{{.Tag}}' cgal/testsuite-docker | grep "^cgal/testsuite-docker:${prefix}" || true)

        echo "## Platform: ${{ matrix.test_platform }}"
        echo
        echo "### Images and compiler versions"
        echo

        if [ -z "$images" ]; then
          echo '**No matching images found in local cache.**'
        else
          echo '| Image | Compiler |'
          echo '|-------|----------|'
          for image in $images; do
            compiler=$(docker run --rm "$image" sh -c "c++ --version 2>/dev/null | head -n 1 || g++ --version 2>/dev/null | head -n 1 || echo unknown")
            echo "| $(quote "${image}") | $(quote "${compiler}") |"
          done
        fi

    - name: Push images
      if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
      run: |
        set -e
        [ -n "$ACTIONS_RUNNER_DEBUG" ] && set -x
        docker login -u maxgimeno -p ${{ secrets.PASSWD }}
        bash -$- ./push.sh ${{ matrix.test_platform }}
        exec >> "$GITHUB_STEP_SUMMARY"
        echo
        echo '### Images pushed successfully.'

    - name: Skip push on pull requests
      if: ${{ !(github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') || github.ref != 'refs/heads/master' }}
      run: |
        echo "Don't upload on pull_requests"
        exec >> "$GITHUB_STEP_SUMMARY"
        echo '### Push skipped (not a push to master branch).'

    - name: Build and check the Toolbx images
      run: |
        set -eo pipefail
        [ -n "$ACTIONS_RUNNER_DEBUG" ] && set -x
        for variant in ${{ matrix.toolbox_variants }}; do
          bash -$- ./build.sh "$variant" --toolbox
          tag=$(echo "$variant" | tr 'A-Z_' 'a-z-')
          bash -$- ./check-toolbox.sh "localhost/cgal/testsuite:${tag}-toolbox" | tee -a "$GITHUB_STEP_SUMMARY"
        done
