name: Dockerfile testsuite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # On Sundays at 01:00
    - cron: '0 1 * * SUN'

jobs:
  compile-and-push-docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test_platform: ['ArchLinux','Debian-stable','Debian-testing','Fedora','Fedora-32','Fedora-rawhide','Ubuntu']
        include:
          # Variants of each platform, base images before the images derived from them
          - test_platform: ArchLinux
            variants: ArchLinux ArchLinux-CXX14 ArchLinux-CXX17-Release ArchLinux-clang ArchLinux-clang-CXX14 ArchLinux-clang-CXX17-Release ArchLinux-clang-CXX20-Release ArchLinux-clang-Release
          - test_platform: Debian-stable
            variants: Debian-stable Debian-stable-Release Debian-stable-cross-compilation-for-arm
          - test_platform: Debian-testing
            variants: Debian-testing Debian-testing-clang-main
          - test_platform: Fedora
            variants: Fedora Fedora-with-LEDA Fedora-Release Fedora-strict-ansi
          - test_platform: Fedora-32
            variants: Fedora-32 Fedora-32-Release
          - test_platform: Fedora-rawhide
            variants: Fedora-rawhide Fedora-rawhide-Release
          - test_platform: Ubuntu
            variants: Ubuntu Ubuntu-CXX11 Ubuntu-NO_DEPRECATED_CODE Ubuntu-no-gmp-no-leda Ubuntu-GCC6 Ubuntu-GCC6-CXX1Z Ubuntu-GCC6-Release Ubuntu-GCC_master_cpp20-Release
      fail-fast: false

    steps:
    - name: Git checkout
      uses: actions/checkout@v6

    - name: Build standard and toolbox images
      env:
        REGISTRY: docker.io
        NAMESPACE: cgal
        IMAGE_NAME: testsuite-docker
      run: |
        set -e
        [ -n "$ACTIONS_RUNNER_DEBUG" ] && set -x
        bash -$- ./build.sh ${{ matrix.variants }}
        docker images

    - name: Summary
      run: |
        set -e
        [ -n "$ACTIONS_RUNNER_DEBUG" ] && set -x
        function quote() {
          printf '`%s`' "$1"
        }
        exec >> "$GITHUB_STEP_SUMMARY"
        prefix=$(echo "${{ matrix.test_platform }}" | tr 'A-Z' 'a-z')
        images=$(docker images --format '{{.Repository}}:{{.Tag}}' cgal/testsuite-docker | grep "^cgal/testsuite-docker:${prefix}" || true)

        echo "## Platform: ${{ matrix.test_platform }}"
        echo
        echo "### Images and compiler versions"
        echo

        if [ -z "$images" ]; then
          echo '**No matching images found in local cache.**'
        else
          echo '| Image | Compiler |'
          echo '|-------|----------|'
          for image in $images; do
            compiler=$(docker run --rm "$image" sh -c "c++ --version 2>/dev/null | head -n 1 || g++ --version 2>/dev/null | head -n 1 || echo unknown")
            echo "| $(quote "${image}") | $(quote "${compiler}") |"
          done
        fi

    - name: Push images
      if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
      run: |
        set -e
        [ -n "$ACTIONS_RUNNER_DEBUG" ] && set -x
        docker login -u maxgimeno -p ${{ secrets.PASSWD }}
        docker push --all-tags docker.io/cgal/testsuite-docker
        exec >> "$GITHUB_STEP_SUMMARY"
        echo
        echo '### Images pushed successfully.'

    - name: Skip push on pull requests
      if: ${{ !(github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') || github.ref != 'refs/heads/master' }}
      run: |
        echo "Don't upload on pull_requests"
        exec >> "$GITHUB_STEP_SUMMARY"
        echo '### Push skipped (not a push to master branch).'

    - name: Check the Toolbx images
      run: |
        set -eo pipefail
        [ -n "$ACTIONS_RUNNER_DEBUG" ] && set -x
        for image in $(docker images --format '{{.Repository}}:{{.Tag}}' cgal/testsuite-docker | grep -- '-toolbox$'); do
          bash -$- ./check-toolbox.sh "$image" | tee -a "$GITHUB_STEP_SUMMARY"
        done
